apiVersion: apps/v1
kind: Deployment
metadata:
  name: capstone-p14-web
  namespace: capstone-p14
spec:
  replicas: 1
  selector:
    matchLabels:
      app: capstone-p14-web
  template:
    metadata:
      labels:
        app: capstone-p14-web
    spec:
      containers:
        - name: nginx
          image: 590507089733.dkr.ecr.ap-south-1.amazonaws.com/capstone-project-13:project13-v1
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
